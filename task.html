    <div class="container">
        <h1>Определитель места в вагоне</h1>
        <p>Верхнее место = зеленый цвет</p>
        <p>Нижнее место = синий цвет</p>
        <p>Боковое место = желтый цвет</p>
        <div class="input-group">
            <label for="seatNumber">Введите номер места:</label>
            <input type="number" id="seatNumber" min="1" max="54" placeholder="от 1 до 54">
        </div>
        
        <button onclick="determineSeat()">Определить место</button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        function determineSeat() {
            const seatNumber = parseInt(document.getElementById('seatNumber').value);
            const resultElement = document.getElementById('result');
            
            if (isNaN(seatNumber) || seatNumber < 1 || seatNumber > 54) {
                resultElement.textContent = "Пожалуйста, введите корректный номер места (от 1 до 54)";
                resultElement.className = "result";
                resultElement.style.display = "block";
                return;
            }
            
            let result = "";
            let resultClass = "";
            
            if (seatNumber <= 36) {
                const compartment = Math.ceil(seatNumber / 4);
                const positionInCompartment = (seatNumber - 1) % 4;
                
                if (positionInCompartment === 0 || positionInCompartment === 2) {
                    result = `Место ${seatNumber} - верхнее основное, отсек ${compartment}`;
                    resultClass = "upper";
                } else {
                    result = `Место ${seatNumber} - нижнее основное, отсек ${compartment}`;
                    resultClass = "lower";
                }
            } else {
                const sidePosition = seatNumber - 36;
                const sideNumber = Math.ceil(sidePosition / 2);
                
                if (sidePosition % 2 === 1) {
                    result = `Место ${seatNumber} - верхнее боковое, боковое место ${sideNumber}`;
                    resultClass = "side";
                } else {
                    result = `Место ${seatNumber} - нижнее боковое, боковое место ${sideNumber}`;
                    resultClass = "side";
                }
            }
            
            resultElement.textContent = result;
            resultElement.className = "result " + resultClass;
            resultElement.style.display = "block";
        }
        
        document.getElementById('seatNumber').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                determineSeat();
            }
        });
    </script>
